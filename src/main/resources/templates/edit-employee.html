<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <main class="container">

        <header class="page-header">
            <h1>Edit Employee</h1>
            <p>Update the employee details below.</p>
        </header>

        <section class="card">
            <h2 th:text="|Employee #${employee.id}|"></h2>

            <form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input id="fullName" type="text" th:field="*{fullName}">
                        <small class="error" th:errors="*{fullName}"></small>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input id="email" type="email" th:field="*{email}">
                        <small class="error" th:errors="*{email}"></small>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input id="phone" type="text" th:field="*{phone}">
                        <small class="error" th:errors="*{phone}"></small>
                    </div>

                    <div class="form-group">
                        <label for="department">Department</label>
                        <input id="department" type="text" th:field="*{department}">
                        <small class="error" th:errors="*{department}"></small>
                    </div>

                    <div class="form-group">
                        <label for="salary">Salary (LKR)</label>
                        <input id="salary" type="number" step="0.01" th:field="*{salary}">
                        <small class="error" th:errors="*{salary}"></small>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">
                        Update Employee
                    </button>

                    <a th:href="@{/employees}" class="btn btn-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </section>

    </main>
</body>

</html>
