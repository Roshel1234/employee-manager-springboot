<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <main class="container">

        <header class="page-header">
            <h1>Employee Manager</h1>
            <p>Add and manage your company employees.</p>
        </header>

        <div class="alert success" th:if="${success}" th:text="${success}">
        </div>

        <section class="card">
            <h2>Add Employee</h2>

            <form th:action="@{/employees}" th:object="${employee}" method="post">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input id="fullName" type="text" th:field="*{fullName}" placeholder="Enter full name">
                        <small class="error" th:errors="*{fullName}"></small>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input id="email" type="email" th:field="*{email}" placeholder="name@example.com">
                        <small class="error" th:errors="*{email}"></small>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input id="phone" type="text" th:field="*{phone}" placeholder="0771234567">
                        <small class="error" th:errors="*{phone}"></small>
                    </div>

                    <div class="form-group">
                        <label for="department">Department</label>
                        <input id="department" type="text" th:field="*{department}" placeholder="Enter department">
                        <small class="error" th:errors="*{department}"></small>
                    </div>

                    <div class="form-group">
                        <label for="salary">Salary (LKR)</label>
                        <input id="salary" type="number" step="0.01" th:field="*{salary}" placeholder="50000.00">
                        <small class="error" th:errors="*{salary}"></small>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    Save Employee
                </button>
            </form>
        </section>

        <section class="card">
            <div class="section-header">
                <h2>Employee List</h2>
                <span class="badge" th:text="|${#lists.size(employees)} employees|">
                </span>
            </div>

            <form th:action="@{/employees}" method="get" class="search-form">
    <label for="keyword">Search employees by name</label>

    <div class="actions">
        <input id="keyword"
               type="search"
               name="keyword"
               th:value="${keyword}"
               placeholder="Enter employee name">

        <button type="submit" class="btn btn-primary">
            Search
        </button>

        <a th:href="@{/employees}" class="btn btn-secondary">
            Clear
        </a>
    </div>
</form>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Department</th>
                            <th>Salary (LKR)</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:if="${#lists.isEmpty(employees)}">
                            <td colspan="7" class="empty-state">
                                No employees yet. Add your first employee above.
                            </td>
                        </tr>

                        <tr th:each="emp : ${employees}">
                            <td th:text="${emp.id}"></td>
                            <td th:text="${emp.fullName}"></td>
                            <td th:text="${emp.email}"></td>
                            <td th:text="${emp.phone}"></td>
                            <td th:text="${emp.department}"></td>
                            <td th:text="${#numbers.formatDecimal(
                        emp.salary, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td>
                                <div class="actions">
                                    <a class="btn btn-edit" th:href="@{/employees/{id}/edit(id=${emp.id})}">
                                        Edit
                                    </a>

                                    <form method="post" th:action="@{/employees/{id}/delete(id=${emp.id})}"
                                        onsubmit="return confirm('Delete this employee?');">
                                        <button type="submit" class="btn btn-delete">
                                            Delete
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>
</body>

</html>
